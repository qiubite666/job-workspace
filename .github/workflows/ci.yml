name: ci

# 日常质量闸门：所有分支的 push 与 PR 都跑格式检查、静态检查、单测、构建。
# 只做校验与产物留存，不发布 Release（发布由 release.yml 在 v* 标签上完成）。

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

# 同一分支有新提交时，取消上一次未跑完的任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: 格式检查（gofmt 必须为空）
        run: |
          set -euo pipefail
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未按 gofmt 格式化："
            echo "$out"
            echo "修复方式：gofmt -w ."
            exit 1
          fi
          echo "gofmt 检查通过"

      - name: 静态检查（go vet）
        run: go vet ./...

      - name: 单元测试（go test）
        run: go test ./...

      - name: 构建（本机）
        run: go build ./...

  # 交叉编译只做 build，不重复跑测试；每个平台单独出一个 artifact
  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: 编译 ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          out="dist/jobworkspace-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          echo "==> ${out}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" -o "$out" .
          ls -l dist

      - name: 上传构建产物（jobworkspace-ci-${{ matrix.goos }}-${{ matrix.goarch }}）
        uses: actions/upload-artifact@v4
        with:
          # artifact 名带平台后缀，避免三个平台互相覆盖或被混淆
          name: jobworkspace-ci-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/jobworkspace-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error
