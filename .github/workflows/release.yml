name: release

# 推送到 v* 标签即构建 Linux / Windows 单二进制并发布 Release（附校验和与分类变更日志）。
# 使用 Runner 自带的 GITHUB_TOKEN，无需在仓库里配置任何密钥。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 变更日志要按 tag 区间遍历历史，必须取全量历史与标签
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: false

      - name: 静态检查与单测
        run: |
          set -euo pipefail
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
          go vet ./...
          go test ./...

      - name: 交叉编译
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 注入的是纯 semver（1.1.0），不带 v 前缀：
          # 用法行与 /api/health 里的 v 由程序自己输出，避免出现 vv1.1.0。
          VER="${TAG#v}"
          mkdir -p dist
          # 构建目标：linux/amd64、linux/arm64、windows/amd64
          # Windows 产物必须带 .exe 后缀，否则下载后无法直接运行。
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/jobworkspace-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              out="${out}.exe"
            fi
            echo "==> ${out}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X jobworkspace/internal/version.Version=${VER}" \
                -o "$out" .
          done
          cd dist
          # 校验和覆盖全部三个产物（含 .exe）
          sha256sum jobworkspace-* > sha256sums.txt
          cat sha256sums.txt

      - name: 冒烟测试（linux/amd64）
        run: |
          set -euo pipefail
          chmod +x dist/jobworkspace-linux-amd64
          ./dist/jobworkspace-linux-amd64 platforms
          # V2 起采集只剩联网模式，不再有 --mode/--file；
          # CI 里不发真实网络请求，只校验子命令与关键参数仍然可用。
          # Go 的 flag 包把 --help 用法写到 stderr，且用单横线显示参数名，
          # 因此必须 2>&1 合并后再按 -allow-disallowed 匹配。
          ./dist/jobworkspace-linux-amd64 collect --help 2>&1 | grep -q -- '-allow-disallowed'

      - name: 生成变更日志
        run: |
          set -euo pipefail
          chmod +x scripts/release-notes.sh
          bash scripts/release-notes.sh --tag "${GITHUB_REF_NAME}" > release-notes.md
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
