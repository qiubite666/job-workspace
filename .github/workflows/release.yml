name: release

# 推送到 v* 标签即构建 Linux 单二进制并发布 Release（附校验和）。
# 使用 Runner 自带的 GITHUB_TOKEN，无需在仓库里配置任何密钥。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: 静态检查与单测
        run: |
          set -euo pipefail
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out
          go vet ./...
          go test ./...

      - name: 交叉编译
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 注入的是纯 semver（1.1.0），不带 v 前缀：
          # 用法行与 /api/health 里的 v 由程序自己输出，避免出现 vv1.1.0。
          VER="${TAG#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/jobworkspace-${os}-${arch}"
            echo "==> ${out}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X jobworkspace/internal/version.Version=${VER}" \
                -o "$out" .
          done
          cd dist
          sha256sum jobworkspace-* > sha256sums.txt
          cat sha256sums.txt

      - name: 冒烟测试（linux/amd64）
        run: |
          set -euo pipefail
          chmod +x dist/jobworkspace-linux-amd64
          ./dist/jobworkspace-linux-amd64 platforms
          ./dist/jobworkspace-linux-amd64 collect --mode=sample --query=Java --json | head -c 200

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
