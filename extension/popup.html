<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BOSS 岗位采集桥</title>
<style>
  .ver { margin-left: 6px; font-size: 11px; color: #8b949e; }
  .hint { margin: 6px 0 0; font-size: 11px; line-height: 1.5; color: #8b949e; }
  * { box-sizing: border-box; }
  body {
    width: 340px;
    margin: 0;
    padding: 14px 16px 16px;
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #1f2328;
    background: #ffffff;
  }
  h1 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
  .sub { margin: 0 0 10px; font-size: 11px; color: #6a737d; }
  label { display: block; margin: 10px 0 4px; font-size: 12px; color: #57606a; }
  input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    font: inherit;
    color: inherit;
    background: #fff;
    outline: none;
  }
  input:focus { border-color: #0969da; box-shadow: 0 0 0 2px rgba(9, 105, 218, 0.12); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    background: #f6f8fa;
    font: inherit;
    cursor: pointer;
  }
  button.primary { border-color: #1f6feb; background: #1f6feb; color: #fff; }
  button:active { transform: translateY(1px); }
  #status { min-height: 16px; margin: 8px 0 0; font-size: 12px; color: #1a7f37; }
  #status.err { color: #cf222e; }
  hr { margin: 14px 0 10px; border: none; border-top: 1px solid #eaeef2; }
  .meta { margin: 0 0 6px; font-size: 11px; color: #6a737d; word-break: break-all; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font-size: 12px; }
  dt { color: #6a737d; }
  dd { margin: 0; word-break: break-all; }
  .empty { font-size: 12px; color: #8c959f; }
  .ok { color: #1a7f37; }
  .fail { color: #cf222e; }
</style>
</head>
<body>
  <h1>BOSS 岗位采集桥</h1>
  <p class="sub">旁听页面岗位响应并上报；不读取任何登录凭据。<span id="ver" class="ver"></span></p>

  <label for="serverUrl">服务端地址</label>
  <input id="serverUrl" type="text" placeholder="https://job.qiubite.fun" autocomplete="off" spellcheck="false">

  <label for="token">X-Ingest-Token</label>
  <input id="token" type="password" placeholder="与服务端 token 保持一致" autocomplete="off">

  <div class="row">
    <button id="save" class="primary" type="button">保存</button>
    <button id="test" type="button">测试连接</button>
  </div>
  <p id="status"></p>

  <hr>
  <p class="meta" id="listAt">列表上报：暂无</p>
  <div id="listBody" class="empty">还没有列表上报记录。</div>

  <hr>
  <p class="meta" id="detailAt">详情上报：暂无</p>
  <div id="detailBody" class="empty">还没有详情上报记录。</div>

  <hr>
  <p class="meta" id="autofillMeta">批量补 JD：未运行</p>
  <div class="row">
    <button id="autofillStart" class="primary" type="button">开始补全</button>
    <button id="autofillStop" type="button">停止</button>
  </div>
  <p class="hint" id="autofillHint">首次使用请先手动点开一个职位。之后每 6-9 秒补一条，连续失败会自动停。</p>

  <script src="popup.js"></script>
</body>
</html>
