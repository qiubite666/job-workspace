# 求职工作台 · 反向代理配置（新增文件，勿覆盖既有配置）
#
# 目标路径：/etc/nginx/sites-enabled/job-workspace.conf
# 若该路径已存在同名文件：不要覆盖。改用 job-workspace-<时间戳>.conf，
# 并确认 server_name 不与既有站点重复（重复时 nginx 只保留先加载的那个，
# 并在 error_log 里报 "conflicting server name"）。
#
# server_name 使用子域名而非 apex：apex 已被现有站点占用，
# 同一 server_name 无法在「只新增文件」的前提下共存。

upstream job_workspace_backend {
    server 127.0.0.1:8787;
    keepalive 16;
}

# ---------- HTTP：仅做跳转 ----------
server {
    listen      80;
    listen      [::]:80;
    server_name job.qiubite.fun;

    # 308 保留方法与请求体，便于日后的 API 调用
    return 308 https://$host$request_uri;
}

# ---------- HTTPS：反向代理 ----------
server {
    # nginx >= 1.25.1 会提示 listen ... http2 已废弃（仅告警，不影响启动）。
    # 若你的版本较新，可改为：listen 443 ssl; 并新增一行 http2 on;
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name job.qiubite.fun;

    ssl_certificate     /etc/nginx/cert/qiubite.fun.crt;
    ssl_certificate_key /etc/nginx/cert/qiubite.fun.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:job_workspace_ssl:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    access_log /var/log/nginx/job-workspace.access.log;
    error_log  /var/log/nginx/job-workspace.error.log warn;

    # 导入 JSON 备份时用到；工作台单条数据量很小，8m 足够
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # ---------- 访问控制 ----------
    # 本服务没有账号体系，暴露在公网等于把「岗位库 + 采集接口」交给任何人。
    # 因此默认整站 Basic Auth。若确实不需要，删除下面三行即可。
    auth_basic           "job-workspace";
    auth_basic_user_file /etc/nginx/job-workspace.htpasswd;

    location / {
        proxy_pass         http://job_workspace_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 置空以便与 upstream keepalive 复用连接
        proxy_set_header   Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering       off;
    }

    # 采集接口会拉起子进程，服务端最长等待 120s，这里放大到 150s
    location = /api/collect {
        proxy_pass         http://job_workspace_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    150s;
        proxy_read_timeout    150s;
        proxy_buffering       off;
    }
}
